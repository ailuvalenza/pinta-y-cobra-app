<html lang="es-AR">
<head>

<!--
  Pintá y Cobrá: app de presupuestos de pintura (Argentina).
  Hecha el 23/11/2026. Sin IA ni servidor: todo se guarda en el celular del pintor (localStorage).
  El PDF se arma en el celular con jsPDF. Los 3 bumps se activan con un código (ver CODIGOS).
  ?demo=1 abre con un ejemplo cargado y no guarda nada (para el quiz y los anuncios).
-->
<style>
:root{--azul:#123a5c;--azul2:#1d5a8c;--amarillo:#ffc928;--amarillo2:#e0a800;--verde:#1f9d55;--rojo:#d64545;--fondo:#f3f5f8;--tarjeta:#fff;--texto:#1c2530;--suave:#5b6776;--borde:#dde3ea}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--fondo);color:var(--texto);font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:520px;margin:0 auto;min-height:100vh}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--azul);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}
.top h1{font-size:17px;font-weight:700;line-height:1.2}
.top .logo{font-size:22px}
.atras{background:rgba(255,255,255,.14);border:0;color:#fff;width:36px;height:36px;border-radius:10px;font-size:24px;line-height:1;cursor:pointer}
main{padding:16px 14px 120px}
h2{font-size:16px;font-weight:700;margin:22px 0 10px}
h2:first-child{margin-top:4px}
p{font-size:14.5px;line-height:1.5;margin-bottom:10px}
small{color:var(--suave)}
.hola{font-size:20px;font-weight:700;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font:700 16px 'Poppins',sans-serif;color:var(--azul);background:var(--amarillo);box-shadow:0 4px 0 var(--amarillo2);cursor:pointer;text-align:center;text-decoration:none;margin:6px 0 10px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--amarillo2)}
.btn.azul{background:var(--azul);color:#fff;box-shadow:0 4px 0 #0a2540}
.btn.verde{background:#25d366;color:#fff;box-shadow:0 4px 0 #128c4b}
.btn.borde{background:#fff;color:var(--azul);border:2px solid var(--borde);box-shadow:none}
.btn.chico{padding:10px 12px;font-size:14px;margin:0}
.btn.rojo{background:#fff;color:var(--rojo);border:2px solid #f3cccc;box-shadow:none}
.card{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.stats div{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-size:17px}
.stats small{font-size:12px}
.pres{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--borde);border-radius:14px;padding:12px 14px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}
.pres b{display:block;font-size:15px}
.pres small{font-size:12px}
.pres .der{text-align:right;flex:none}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:#eef1f5;color:var(--suave);margin-top:3px}
.e-enviado{background:#e6f0fb;color:var(--azul2)}.e-aprobado{background:#e3f6ea;color:var(--verde)}.e-perdido{background:#fbe9e9;color:var(--rojo)}
.vacio{color:var(--suave);background:#fff;border:1px dashed var(--borde);border-radius:14px;padding:16px;text-align:center}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:14px 10px;font:600 13.5px 'Poppins',sans-serif;color:var(--texto);cursor:pointer;text-align:center}
.menu button span{display:block;font-size:24px;margin-bottom:4px}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--suave)}
input.i,textarea.i,select.i{width:100%;padding:12px;border-radius:12px;border:2px solid var(--borde);font:500 16px 'Poppins',sans-serif;color:var(--texto);background:#fff;outline:none}
input.i:focus,textarea.i:focus{border-color:var(--azul2)}
textarea.i{min-height:90px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.amb{background:#fff;border:1px solid var(--borde);border-left:5px solid var(--amarillo);border-radius:14px;padding:12px;margin-bottom:12px}
.amb-top{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.amb-top input{flex:1;font-weight:700}
.ib{flex:none;width:42px;height:42px;border-radius:10px;border:2px solid var(--borde);background:#fff;font-size:17px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

.seg{display:flex;background:var(--fondo);border-radius:12px;padding:3px;margin-bottom:10px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;font:600 12.5px 'Poppins',sans-serif;color:var(--suave);cursor:pointer;line-height:1.25}
.seg button.on{background:#fff;color:var(--azul);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg-t{font-size:13px;font-weight:600;color:var(--suave);margin:2px 0 5px}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14.5px;cursor:pointer}
.ck input{width:22px;height:22px;accent-color:var(--azul);flex:none}
.vivo{background:#fff8dc;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;margin-top:6px}
.dicta{background:#e6f0fb;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:8px}
.pie{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--borde);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.pie-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.pie .tot{flex:none}
.pie .tot small{display:block;font-size:11px}
.pie .tot b{font-size:19px}
.pie .btn{margin:0}
.res-top{background:var(--azul);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.res-top small{color:#c8d6e5}

.m2s{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.m2s span{background:rgba(255,255,255,.14);border-radius:99px;padding:4px 10px;font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td{padding:7px 0;border-bottom:1px dashed var(--borde);vertical-align:top}
table.t td.n{text-align:right;white-space:nowrap;padding-left:8px}
table.t td small{display:block;font-size:11.5px}
table.t tr.tt td{border-bottom:0;font-weight:700;padding-top:9px}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--borde);border-radius:14px;padding:12px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}
.tool .em{font-size:26px;flex:none}
.tool b{display:block;font-size:14.5px}
.tool small{font-size:12.5px;line-height:1.35;display:block}
.tool .lk{margin-left:auto;font-size:18px;flex:none}
.aviso{background:#fff3f3;border:1px solid #f3cccc;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.ok{background:#e9f8ef;border:1px solid #bfe8cf;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.info{background:#fff8dc;border:1px solid #f4e3a1;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.fila{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--borde);font-size:14px}
.fila.big{font-size:17px;font-weight:800;border-bottom:0}
.pr-row{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--borde)}
.pr-row span{font-size:13.5px;line-height:1.3}
.pr-row small{display:block;font-size:11.5px}
.pr-row input{padding:9px 10px;font-size:15px;text-align:right}
.opc3{display:grid;gap:10px}
.opc3 .card.rec{border:2px solid var(--amarillo)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--texto);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.sep{height:1px;background:var(--borde);margin:16px 0}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script>
(function(){
'use strict';

var KEY = 'pintaycobra:v1';
var qs = new URLSearchParams(location.search);
var DEMO = qs.get('demo') === '1';
var DEMO_ID = null;

/* ============ Precios de arranque ============
   Referencia: iProfesional (PropData) nov/2026 y Mercado Libre; CABA y GBA.
   El pintor los cambia por los suyos la primera vez. [id, grupo, nombre, unidad, precio] */
var BASE = [
  ['pared','mo','Pintura de paredes (2 manos)','m²',5500],
  ['techo','mo','Cielorraso (2 manos)','m²',7000],
  ['ext','mo','Frente o pared exterior (2 manos)','m²',8000],
  ['manoExtra','mo','Mano extra (color fuerte o cambio de color)','m²',1800],
  ['enduido','mo','Enduido y lijado','m²',4500],
  ['fijador','mo','Fijador sellador','m²',900],
  ['humedad','mo','Tratar humedad u hongos','m²',3500],
  ['grieta','mo','Reparar grietas o fisuras','metro',4000],
  ['puerta','mo','Puerta (2 caras + marco)','unidad',45000],
  ['reja','mo','Rejas o portón (antióxido + 2 manos)','m²',9000],
  ['muebles','mo','Mover y tapar muebles','ambiente',15000],
  ['andamio','mo','Andamio o trabajo en altura','día',25000],
  ['latInt20','mat','Látex interior 20 L','lata',110000],
  ['latInt4','mat','Látex interior 4 L','lata',30000],
  ['latTec20','mat','Látex para cielorraso 20 L','lata',95000],
  ['latTec4','mat','Látex para cielorraso 4 L','lata',26000],
  ['latExt20','mat','Látex exterior 20 L','lata',150000],
  ['latExt4','mat','Látex exterior 4 L','lata',40000],
  ['enduidoMat','mat','Enduido 20 L','balde',55000],
  ['fijadorMat','mat','Fijador sellador 4 L','lata',28000],
  ['esmalte','mat','Antióxido o esmalte sintético 1 L','lata',22000],
  ['lija','mat','Lija','pliego',1200],
  ['cinta','mat','Cinta de papel','rollo',4500],
  ['nylon','mat','Nylon para cubrir','unidad',6000]
];
var P = {}, PR0 = {};
BASE.forEach(function(b){ P[b[0]] = {g:b[1], n:b[2], u:b[3]}; PR0[b[0]] = b[4]; });

var AJ0 = {
  alto:2.5, descontar:false, puertaM2:1.8, ventanaM2:1.5,
  rindeLatex:10, rindeExt:8, rindeEnduido:25, rindeFijador:100, rindeEsmalte:8, desperdicio:10,
  validez:15, garantia:'6 meses sobre la mano de obra', jornal:60000
};

/* Códigos de los bumps (se guarda solo el SHA-256 de "pyc:" + código sin guiones) */
var CODIGOS = {
  lista:'ddcd5da9e210a0d8b224b3a25ae30ec9f1f873d4603b86756b5e5b77412c2aee',
  sena:'f85ad735add6d63383890c5165f51c19c78efdba63f060f5cf1c9d12de44b478',
  opc:'6068d4e596b08d138dd4a79f7888f34c94513230dab28d9e9ffd27c952e6d3a8'
};
var TOOLS = {
  lista:{e:'🧾', t:'Lista de Material para el Cliente', d:'La lista exacta de latas, enduido y lijas para que el cliente compre sin que sobre ni falte.'},
  sena:{e:'✍️', t:'Contrato y Seña', d:'Acuerdo de trabajo con la seña, el saldo y qué no está incluido, más el recibo de la seña.'},
  opc:{e:'🎯', t:'Presupuesto en 3 Opciones', d:'Básica, Recomendada y Premium en un solo PDF: el cliente elige entre tus opciones y no entre vos y el más barato.'}
};
var ESTADOS = {borrador:'Borrador', enviado:'Enviado', aprobado:'Aprobado', perdido:'Perdido'};
var NOMBRES_AMB = ['Living','Comedor','Dormitorio','Cocina','Baño','Pasillo','Frente','Patio'];

/* ============ Estado ============ */
function estadoNuevo(){
  var pr = {}; for (var k in PR0) pr[k] = PR0[k];
  return {v:1, listo:false, datos:{nombre:'', empresa:'', tel:'', zona:''}, precios:pr, aj:JSON.parse(JSON.stringify(AJ0)), pres:[], num:0, unlock:{}};
}
function cargar(){
  try {
    var s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v) {
      for (var k in PR0) if (!(k in s.precios)) s.precios[k] = PR0[k];
      for (var j in AJ0) if (!(j in s.aj)) s.aj[j] = AJ0[j];
      if (s.aj.rindeFijador === 40) s.aj.rindeFijador = AJ0.rindeFijador;
      s.unlock = s.unlock || {}; s.pres = s.pres || []; s.datos = s.datos || {};
      return s;
    }
  } catch (e) {}
  return estadoNuevo();
}
var S = DEMO ? demoEstado() : cargar();
function guardar(){
  if (DEMO) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('No se pudo guardar en este celular'); }
}

/* ============ Ayudas ============ */
function num(v){
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  v = String(v == null ? '' : v).replace(/[\s$]/g, '');
  if (v.indexOf(',') > -1) v = v.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g, '');
  var n = parseFloat(v); return isFinite(n) ? n : 0;
}
function plata(n){ return '$ ' + Math.round(n).toLocaleString('es-AR'); }
function dec(n){ return (Math.round(n * 10) / 10).toLocaleString('es-AR', {minimumFractionDigits:1, maximumFractionDigits:1}); }
function m2(n){ return dec(n) + ' m²'; }
function miles(n){ return Math.round(n).toLocaleString('es-AR'); }
function r100(n){ return Math.round(n / 100) * 100; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return ('000' + n).slice(-4); }
function hoy(){ return new Date().toLocaleDateString('es-AR'); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function plural(n, u){
  if (n === 1) return '1 ' + u;
  var pl = {lata:'latas', balde:'baldes', rollo:'rollos', unidad:'unidades', pliego:'pliegos', metro:'metros', 'día':'días', ambiente:'ambientes'};
  return miles(n) + ' ' + (pl[u] || u);
}
function cantTxt(c, u){ return u === 'm²' ? m2(c) : (u === 'metro' ? dec(c) + ' m' : plural(Math.round(c), u)); }
function toast(t){
  var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 2800);
}

/* ============ Presupuesto ============ */
function nuevoAmb(nombre){
  return {id:uid(), nombre:nombre || 'Ambiente', modo:'med', largo:'', ancho:'', alto:String(S.aj.alto).replace('.', ','),
    m2p:'', m2t:'', puertas:'1', ventanas:'1', paredes:true, techo:true, ext:false, manos:2, enduido:'no', fijador:false, humedad:''};
}
function nuevoPres(){
  S.num = (S.num || 0) + 1;
  return {id:uid(), num:S.num, ts:Date.now(), fecha:hoy(), cliente:{nombre:'', tel:'', dir:''}, amb:[nuevoAmb('Living')],
    ex:{grieta:'', puerta:'', reja:'', muebles:'', andamio:'', otros:[]}, conMat:true, ajuste:'', notas:'', estado:'borrador',
    queda:{dias:'', ayDias:'', ayJornal:'', viajes:'', viaje:'', herr:'', otros:''},
    sena:{pct:'50', inicio:'', plazo:'', forma:'Efectivo o transferencia'}};
}

/* Calcula todo. opt (para 3 opciones): {enduido, manos, fm (factor del látex), sinFijador} */
function calc(p, opt){
  opt = opt || {};
  var pr = S.precios, aj = S.aj, fm = opt.fm || 1, aju = 1 + num(p.ajuste) / 100;
  var A = {parInt:0, parExt:0, techo:0, extra:0, end:0, fij:0, hum:0, lInt:0, lTec:0, lExt:0, nInt:0, n:0};
  var det = [];
  p.amb.forEach(function(a){
    var par = 0, tec = 0;
    if (a.modo === 'm2') { par = num(a.m2p); tec = num(a.m2t); }
    else {
      var L = num(a.largo), W = num(a.ancho), H = num(a.alto) || aj.alto;
      par = 2 * (L + W) * H;
      if (aj.descontar) par -= num(a.puertas) * aj.puertaM2 + num(a.ventanas) * aj.ventanaM2;
      tec = L * W;
    }
    par = Math.max(0, par); if (!a.paredes) par = 0; if (!a.techo || a.ext) tec = 0;
    var manos = opt.manos || a.manos || 2;
    var end = opt.enduido || a.enduido;
    var fij = opt.sinFijador ? false : a.fijador;
    if (par + tec <= 0) { det.push({nombre:a.nombre, par:0, tec:0, manos:manos, end:end, fij:fij, hum:0, ext:a.ext}); return; }
    A.n++;
    if (a.ext) { A.parExt += par; A.lExt += par * manos / aj.rindeExt; }
    else { A.parInt += par; A.lInt += par * manos / aj.rindeLatex; A.nInt++; }
    A.techo += tec; A.lTec += tec * manos / aj.rindeLatex;
    if (manos > 2) A.extra += (par + tec) * (manos - 2);
    A.end += end === 'total' ? par : end === 'parcial' ? par * 0.3 : 0;
    if (fij) A.fij += par + tec;
    var hum = Math.min(num(a.humedad), par + tec); A.hum += hum;
    det.push({nombre:a.nombre, par:par, tec:tec, manos:manos, end:end, fij:fij, hum:hum, ext:a.ext});
  });

  var mo = [], mat = [];
  function lmo(id, cant, txt){ if (cant > 0.0001) { var pu = pr[id] * aju; mo.push({txt:txt || P[id].n, cant:cant, u:P[id].u, pu:pu, tot:r100(cant * pu)}); } }
  lmo('pared', A.parInt, 'Pintura de paredes (2 manos)');
  lmo('techo', A.techo, 'Pintura de cielorraso (2 manos)');
  lmo('ext', A.parExt, 'Frente o paredes exteriores (2 manos)');
  lmo('manoExtra', A.extra, 'Mano extra');
  lmo('enduido', A.end);
  lmo('fijador', A.fij);
  lmo('humedad', A.hum);
  lmo('grieta', num(p.ex.grieta));
  lmo('puerta', num(p.ex.puerta));
  lmo('reja', num(p.ex.reja));
  lmo('muebles', num(p.ex.muebles));
  lmo('andamio', num(p.ex.andamio));
  (p.ex.otros || []).forEach(function(o){ var m = num(o.monto); if (m > 0) mo.push({txt:o.txt || 'Otro trabajo', cant:1, u:'', pu:m, tot:m}); });

  function lm(id, n, f){ if (n > 0) { var pu = pr[id] * (f || 1); mat.push({txt:P[id].n, cant:n, u:P[id].u, pu:pu, tot:r100(n * pu)}); } }
  var d = 1 + aj.desperdicio / 100;
  function latas(litros, id20, id4){
    litros *= d; if (litros < 0.05) return;
    var n20 = Math.floor(litros / 20), r = litros - n20 * 20, n4 = 0;
    if (r > 12) n20++; else if (r > 0.05) n4 = Math.ceil(r / 4);
    lm(id20, n20, fm); lm(id4, n4, fm);
  }
  latas(A.lInt, 'latInt20', 'latInt4');
  latas(A.lTec, 'latTec20', 'latTec4');
  latas(A.lExt, 'latExt20', 'latExt4');
  if (A.end > 0) lm('enduidoMat', Math.ceil(A.end * d / aj.rindeEnduido));
  if (A.fij > 0) lm('fijadorMat', Math.ceil(A.fij * d / aj.rindeFijador));
  var esm = num(p.ex.reja) / aj.rindeEsmalte + num(p.ex.puerta) * 0.5;
  if (esm > 0) lm('esmalte', Math.ceil(esm));
  var pint = A.parInt + A.parExt + A.techo;
  if (pint > 0) {
    lm('lija', Math.ceil(A.end / 5 + pint / 30));
    lm('cinta', Math.max(1, A.n));
    if (A.nInt) lm('nylon', A.nInt);
  }
  var totMO = mo.reduce(function(s, x){ return s + x.tot; }, 0);
  var totMat = mat.reduce(function(s, x){ return s + x.tot; }, 0);
  return {A:A, det:det, mo:mo, mat:mat, totMO:totMO, totMat:totMat, total:totMO + (p.conMat ? totMat : 0)};
}

function detTxt(x){
  var t = [];
  if (x.par) t.push((x.ext ? 'exterior ' : 'paredes ') + m2(x.par));
  if (x.tec) t.push('cielorraso ' + m2(x.tec));
  if (!t.length) return 'sin medidas';
  t.push(x.manos + ' manos');
  if (x.end === 'parcial') t.push('enduido en detalles');
  if (x.end === 'total') t.push('enduido completo');
  if (x.fij) t.push('fijador');
  if (x.hum) t.push('humedad ' + m2(x.hum));
  return t.join(' · ');
}

function setPath(root, path, val){

}

  if (t.dataset.num !== undefined && t.type !== 'checkbox') val = num(val);
  setPath(root, path.slice(2), val);
}

function importar(f){
  var r = new FileReader();
  r.onload = function(){
    try {
      var s = JSON.parse(r.result);
      if (!s || !s.v || !s.precios) throw 0;
      if (!confirm('¿Reemplazar lo de este celular por la copia (' + (s.pres || []).length + ' presupuestos)?')) return;
      localStorage.setItem(KEY, JSON.stringify(s)); S = cargar(); go('inicio'); toast('Copia recuperada');
    } catch (e) { toast('Ese archivo no es una copia de Pintá y Cobrá'); }
  };
  r.readAsText(f);
}

function sha(s){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
  });
}
function probarCodigo(c){
  c = String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!c || !window.crypto || !crypto.subtle) return Promise.resolve(null);
  return sha('pyc:' + c).then(function(h){
    for (var k in CODIGOS) if (CODIGOS[k] === h) { S.unlock[k] = true; guardar(); return k; }
    return null;
  });
}

/* ============ PDF ============ */
function hacerPDF(k){
  if (!window.jspdf) { toast('Cargando… probá de nuevo en un segundo (necesitás internet)'); return; }
  var p = pres(), doc;
  try {
    doc = k === 'lista' ? pdfLista(p) : k === 'sena' ? pdfSena(p) : k === 'opc' ? pdfOpc(p) : pdfPres(p);
  } catch (e) { toast('No se pudo armar el PDF'); return; }
  var nombres = {pres:'Presupuesto', lista:'Lista-de-material', sena:'Acuerdo-y-sena', opc:'Presupuesto-3-opciones'};
  var nom = nombres[k] + '-' + pad(p.num) + (p.cliente.nombre ? '-' + p.cliente.nombre.replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g, '-') : '') + '.pdf';
  var blob = doc.output('blob');
  var file = null; try { file = new File([blob], nom, {type:'application/pdf'}); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({files:[file]})) {
    navigator.share({files:[file], title:nom}).then(function(){ if (k === 'pres' && p.estado === 'borrador') { p.estado = 'enviado'; guardar(); rerender(); } }).catch(function(){});
  } else {
    doc.save(nom); toast('PDF descargado: adjuntalo en el chat del cliente');
  }
}
function pdfBase(titulo, p){
  var J = window.jspdf.jsPDF, doc = new J({unit:'mm', format:'a4'}), W = 210, M = 15;
  doc.setFillColor(18, 58, 92); doc.rect(0, 0, W, 30, 'F');
  doc.setFillColor(255, 201, 40); doc.rect(0, 30, W, 1.6, 'F');
  doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text(S.datos.empresa || S.datos.nombre || 'Pintura', M, 13);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  doc.text([S.datos.empresa ? S.datos.nombre : '', S.datos.tel, S.datos.zona].filter(Boolean).join('  ·  '), M, 21);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text(titulo, W - M, 13, {align:'right'});
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.text('N.º ' + pad(p.num) + '  ·  ' + p.fecha, W - M, 21, {align:'right'});
  doc.setTextColor(28, 37, 48);
  var c = {doc:doc, y:42, M:M, W:W};
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.text('Cliente:', M, c.y);
  doc.setFont('helvetica', 'normal'); doc.text([p.cliente.nombre || '-', p.cliente.dir].filter(Boolean).join('  ·  '), M + 17, c.y);
  c.y += 9; return c;
}
function seguro(c, h){ if (c.y + h > 282) { c.doc.addPage(); c.y = 20; } }
function titulo(c, t){
  seguro(c, 16); var d = c.doc;
  d.setFillColor(243, 245, 248); d.rect(c.M, c.y - 5, c.W - 2 * c.M, 7.5, 'F');
  d.setFont('helvetica', 'bold'); d.setFontSize(10.5); d.text(t, c.M + 2, c.y); c.y += 8;
  d.setFont('helvetica', 'normal'); d.setFontSize(9.5);
}
function filas(c, rows, total){
  var d = c.doc;
  rows.forEach(function(f){
    var ls = d.splitTextToSize(f[0], 105); seguro(c, ls.length * 4.6 + 2);
    d.text(ls, c.M + 2, c.y); if (f[1]) d.text(f[1], c.M + 145, c.y, {align:'right'}); if (f[2]) d.text(f[2], c.W - c.M - 2, c.y, {align:'right'});
    c.y += ls.length * 4.6 + 1.4;
  });
  if (total) {
    d.setDrawColor(221, 227, 234); d.line(c.M, c.y - 1.5, c.W - c.M, c.y - 1.5);
    d.setFont('helvetica', 'bold'); d.text(total[0], c.M + 2, c.y + 3.5); d.text(total[1], c.W - c.M - 2, c.y + 3.5, {align:'right'});
    d.setFont('helvetica', 'normal'); c.y += 11;
  } else c.y += 4;
}
function parrafo(c, t, tam){
  var d = c.doc; d.setFontSize(tam || 9.5); var ls = d.splitTextToSize(t, c.W - 2 * c.M - 4);
  seguro(c, ls.length * 4.6 + 2); d.text(ls, c.M + 2, c.y); c.y += ls.length * 4.6 + 2;
}
function cajaTotal(c, txt, monto, sub){

  d.setFillColor(18, 58, 92); d.roundedRect(c.M, c.y, c.W - 2 * c.M, sub ? 18 : 14, 3, 3, 'F');
  d.setTextColor(255, 255, 255); d.setFont('helvetica', 'bold'); d.setFontSize(12); d.text(txt, c.M + 5, c.y + 9);
  d.setFontSize(16); d.text(monto, c.W - c.M - 5, c.y + 9.5, {align:'right'});
  if (sub) { d.setFont('helvetica', 'normal'); d.setFontSize(8.5); d.text(sub, c.M + 5, c.y + 14.5); }
  d.setTextColor(28, 37, 48); d.setFont('helvetica', 'normal'); c.y += (sub ? 18 : 14) + 8;
}

  parrafo(c, p.conMat ? 'Los materiales están incluidos en el precio.' : 'Los materiales los compra el cliente, según la lista que le pasa el pintor.');
  c.y += 2; titulo(c, 'Precio y pagos');
  filas(c, [['Precio total del trabajo', '', plata(r.total)], ['Seña al confirmar (' + num(s.pct) + ' %)', '', plata(se)], ['Saldo al terminar el trabajo', '', plata(r.total - se)]]);
  parrafo(c, 'Forma de pago: ' + (s.forma || '-') + '.');
  c.y += 2; titulo(c, 'Fechas');
  parrafo(c, 'Inicio: ' + (s.inicio || 'a coordinar') + '. Plazo estimado: ' + (s.plazo ? s.plazo + ' días hábiles' : 'a coordinar') + ', sujeto a lluvia en trabajos exteriores y a que el lugar esté disponible.');
  condiciones(c, ['Si el cliente cancela después de confirmar, la seña cubre los materiales comprados y los días reservados.', 'El saldo se paga el día que se termina y se entrega el trabajo.']);
  c.y += 14; seguro(c, 30); var d = c.doc;
  d.line(c.M + 5, c.y, c.M + 75, c.y); d.line(c.W - c.M - 75, c.y, c.W - c.M - 5, c.y);
  d.setFontSize(9); d.text('Firma del cliente', c.M + 40, c.y + 5, {align:'center'}); d.text('Firma del pintor', c.W - c.M - 40, c.y + 5, {align:'center'});
  c.y += 16;
  titulo(c, 'Recibo de seña');
  parrafo(c, 'Recibí de ' + (p.cliente.nombre || '____________________') + ' la suma de ' + plata(se) + ' en concepto de seña por el trabajo de pintura del presupuesto N.º ' + pad(p.num) + '.     Fecha: ____/____/______     Firma: ____________________');
  return c.doc;
}
function pdfOpc(p){

  });

}
